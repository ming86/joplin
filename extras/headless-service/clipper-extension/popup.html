<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Joplin text clipper</title><link rel="stylesheet" href="popup.css"></head>
<body><h1>Joplin text clipper</h1>
<label>Clipping endpoint <input id="endpoint" type="url" placeholder="https://notes.example/clipper/"></label>
<label>Clipping token <input id="token" type="password" autocomplete="off"></label>
<button id="connect">Allow endpoint and load notebooks</button>
<label>Notebook <select id="notebook"></select></label>
<label>Title <input id="title" maxlength="512"></label>
<label>Source URL <input id="source" type="url"></label>
<label>Plain text <textarea id="text" rows="8"></textarea></label>
<button id="capture">Capture selection</button> <button id="send">Save clip</button>
<button id="discard" hidden>Discard local pending clip</button>
<p id="status" role="status" aria-live="polite"></p>
<p class="hint">Token and pending text stay in this browser session, not in synced storage. Review private URL query parameters before sending. A local save is not confirmation of synchronization.</p>
<p class="hint" id="identity"></p>
<script type="module" src="popup.mjs"></script></body></html>
